  <style>
    :root{--blue:#0F6CBD;--blue-d:#0A4E8A;--muted:#6b7280;--line:#e3e8ee;}
    html,body{margin:0;height:100%;}
    body{font-family:-apple-system,"Yu Gothic","Hiragino Sans",sans-serif;background:#eef2f6;color:#1f2933;
         display:flex;align-items:center;justify-content:center;padding:24px;}
    .card{width:100%;max-width:380px;text-align:center;}
    .logo{height:40px;margin-bottom:8px;}
    .ttl{font-size:15px;color:var(--blue-d);font-weight:700;margin-bottom:30px;}
    .go{display:block;background:var(--blue);color:#fff;text-decoration:none;font-size:23px;font-weight:800;
        padding:26px;border-radius:18px;box-shadow:0 6px 16px rgba(15,108,189,.30);}
    .go:active{transform:scale(.99);}
    .err{color:#C5221F;font-size:15px;}
    .hint{margin-top:28px;font-size:12.5px;color:var(--muted);line-height:1.7;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;}
    .hint b{color:var(--blue-d);}
    .foot{margin-top:18px;font-size:11px;color:#9aa4ad;}
  </style>
